<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — room74</title>
    <style>
        :root {
            --primary-color: #5B42F5;
            --primary-hover: #4F32E5;
            --bg-color: #F8F9FC;
            --card-bg: #FFFFFF;
            --text-main: #1A1D20;
            --text-muted: #6C757D;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* Шапка */
        .header {
            background-color: var(--card-bg);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0E1028;
        }

        .logo span {
            color: var(--primary-color);
        }

        .search-bar {
            background-color: #F1F3F9;
            border: none;
            border-radius: 24px;
            padding: 10px 24px;
            width: 320px;
            font-size: 14px;
            outline: none;
        }

        .header-menu {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .menu-link {
            text-decoration: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
        }

        .menu-link.active {
            color: var(--primary-color);
        }

        .profile-btn {
            background-color: #EEECFC;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
        }

        /* Контент страницы */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 32px;
        }

        @media (max-width: 992px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            grid-column: 1 / -1;
        }

        /* Список бронирований */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            gap: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            position: relative;
        }

        .item-image {
            width: 180px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #E2E8F0;
        }

        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .item-address {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .item-details {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 14px;
        }

        .detail-label {
            color: var(--text-muted);
        }

        .detail-value {
            font-weight: 500;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #E53E3E;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            align-self: flex-start;
            padding: 4px 0;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        /* Правая панель — Итого */
        .summary-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            height: fit-content;
        }

        .summary-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 15px;
        }

        .summary-row.total {
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
            padding-top: 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .checkout-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .checkout-btn:hover {
            background-color: var(--primary-hover);
        }

        .promo-container {
            margin-top: 20px;
            display: flex;
            gap: 8px;
        }

        .promo-input {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
        }

        .promo-btn {
            background-color: #F1F3F9;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    {% include 'header.html' %}

    <!-- Основной контент -->
    <main class="main-container">
        <h1 class="page-title">Корзина бронирований</h1>

        <!-- Элементы в корзине -->
        <div class="cart-items">
            
            <!-- Карточка 1 -->

    {% for item in basket %}
        
    <div class="cart-item">
        <img src="{{ item.room_object.hotel.img.url }}" width="150px" height="150px">
        <!-- Данные из базы данных через объект RoomType -->
        <h3>{{ item.room_object.name }}</h3> 
        <!-- Данные, прилетевшие из AJAX запроса -->
        <p>Заезд: {{ item.check_in }}</p>
        <p>Выезд: {{ item.check_out }}</p>
        <p>Цена: {{ item.total_price }} ₽</p>
    </div>

    {% empty %}
        <p>Добавьте отели в корзину!!!</p>
    {% endfor %}
    </main>

</body>
</html>
